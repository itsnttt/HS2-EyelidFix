name: Publish release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build HS2-EyelidFix.sln --configuration Release
      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(dotnet msbuild src/HS2.EyelidFix/HS2.EyelidFix.csproj -getProperty:Version)
            test "$GITHUB_REF_NAME" = "v$version"
            grep -Fq "\"HS2 Eyelid Fix\",\"$version\"" src/HS2.EyelidFix/Plugin.cs
          fi
          mkdir -p dist/BepInEx/plugins
          cp src/HS2.EyelidFix/bin/Release/net46/HS2_EyelidFix.dll dist/BepInEx/plugins/
          (cd dist && zip -q HS2-EyelidFix.zip BepInEx/plugins/HS2_EyelidFix.dll)
      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          asset="HS2-EyelidFix-$GITHUB_REF_NAME.zip"
          mv dist/HS2-EyelidFix.zip "$asset"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --verify-tag --repo "$GITHUB_REPOSITORY" --title "HS2 Eyelid Fix $GITHUB_REF_NAME" --notes "Extract the ZIP into your HS2 game folder with Studio closed. Incompatible with Freelancer604 Vanity Studio."
          fi

